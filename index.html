<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Starter Kit 🚀</title>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #161b22, #21262d);
    border-bottom: 1px solid #30363d;
    padding: 50px 20px 40px;
    text-align: center;
  }

  header .badge {
    display: inline-block;
    background: rgba(0,210,255,0.1);
    border: 1px solid rgba(0,210,255,0.3);
    color: #00d2ff;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }

  header p {
    color: #8b949e;
    font-size: 1.1rem;
    max-width: 500px;
    margin: 0 auto 30px;
  }

  .chromebook-notice {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,200,100,0.1);
    border: 1px solid rgba(0,200,100,0.3);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 0.9rem;
    color: #7ee787;
  }

  /* ── HOW IT WORKS ── */
  .how-section {
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
  }

  .section-title {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #e6edf3;
  }

  .section-sub {
    text-align: center;
    color: #8b949e;
    margin-bottom: 35px;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .step {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 24px 18px;
    text-align: center;
    transition: border-color 0.2s, transform 0.2s;
  }

  .step:hover {
    border-color: #00d2ff;
    transform: translateY(-3px);
  }

  .step-num {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1rem;
    margin: 0 auto 12px;
  }

  .step h3 { font-size: 0.95rem; margin-bottom: 6px; }
  .step p  { font-size: 0.82rem; color: #8b949e; line-height: 1.5; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 0 20px;
    margin-bottom: 35px;
  }

  .filter-btn {
    background: #161b22;
    border: 1px solid #30363d;
    color: #8b949e;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .filter-btn:hover,
  .filter-btn.active {
    background: rgba(0,210,255,0.1);
    border-color: #00d2ff;
    color: #00d2ff;
  }

  /* ── PROJECTS GRID ── */
  .projects-section {
    max-width: 1200px;
    margin: 0 auto 80px;
    padding: 0 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 18px;
    padding: 28px;
    position: relative;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-5px);
    border-color: #444d56;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  /* colored top bar per card */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--color, linear-gradient(90deg, #00d2ff, #7b2ff7));
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .card-icon {
    font-size: 2.2rem;
    line-height: 1;
  }

  .card-meta h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .difficulty {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .d-beginner     { background: rgba(0,200,100,0.15); color: #3fb950; }
  .d-intermediate { background: rgba(255,165,0,0.15);  color: #d29922; }
  .d-advanced     { background: rgba(248,81,73,0.15);  color: #f85149; }

  .card-desc {
    color: #8b949e;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  /* wiring hint */
  .wiring {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 0.78rem;
    color: #8b949e;
    line-height: 1.7;
  }

  .wiring strong {
    color: #e6edf3;
    display: block;
    margin-bottom: 4px;
  }

  /* tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }

  .tag {
    background: #21262d;
    border: 1px solid #30363d;
    color: #8b949e;
    padding: 2px 9px;
    border-radius: 8px;
    font-size: 0.75rem;
  }

  /* ESP Web Tools button */
  esp-web-install-button {
    display: block;
    width: 100%;
  }

  esp-web-install-button::part(button) {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s, transform 0.1s;
  }

  esp-web-install-button::part(button):hover {
    opacity: 0.88;
    transform: scale(1.02);
  }

  .no-support-msg {
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.3);
    color: #f85149;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.85rem;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 30px 20px;
    border-top: 1px solid #21262d;
    color: #484f58;
    font-size: 0.85rem;
  }

  footer a { color: #7b2ff7; text-decoration: none; }

  /* hidden by filter */
  .card.hidden { display: none; }
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->

  <div class="badge">✨ ESP32 Starter Kit</div>
  <h1>Learn Electronics!</h1>
  <p>10 hands-on projects — flash code directly from your browser, no software needed.</p>
