<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Web IDE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="ide-header">
        <h1>ESP32 Web Flasher & IDE</h1>
        <p>Select a project, connect your board, and click Flash!</p>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Sidebar: Project List -->
        <aside class="sidebar">
            <h2>Projects</h2>
            <ul id="project-list">
                <!-- Projects will be loaded here dynamically via JavaScript -->
            </ul>
        </aside>

        <!-- Main Content: Project Details & Flasher -->
        <main class="main-content">
            <h2 id="project-title">Select a project to begin</h2>
            
            <div class="details-card">
                <h3>Description</h3>
                <p id="project-description">Project details will appear here.</p>
                
                <h3>Required Components</h3>
                <p id="project-components">-</p>
            </div>

            <!-- Flashing Controls -->
            <div class="flash-controls">
                <button id="connect-btn" class="btn primary">1. Connect ESP32</button>
                <button id="flash-btn" class="btn success" disabled>2. Flash to Board</button>
                <div id="status-message" class="status">Status: Waiting for connection...</div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
